<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporte de Ventas e Inmuebles - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght=300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="css/admin.css">

  <script type="module">
       
    </script>    
</head>
<body>
    <div class="dashboard-container container-fluid p-4">
        
        <div class="header d-flex justify-content-between align-items-center mb-4">
            <h2><i class="fas fa-chart-line" style="color: #22c55e; margin-right: 12px;"></i> Módulo de Reportes de Ventas</h2>
            <a href="admin.html" class="btn-home text-decoration-none"><i class="fas fa-arrow-left"></i> Volver al Panel</a>
        </div>

        <div class="card border-0 shadow-sm p-4 mb-4">
            <h5 class="fw-bold mb-3 text-secondary"><i class="fas fa-sliders-h me-2"></i> Selectores de Filtros Avanzados</h5>
            
            <form id="ventas-filter-form" class="row g-3 align-items-end">
                
                <div class="col-12 col-sm-6 col-md-3">
                    <label for="venta-desde" class="form-label small text-muted fw-semibold">Fecha Desde:</label>
                    <input type="date" id="venta-desde" class="form-control">
                </div>
                
                <div class="col-12 col-sm-6 col-md-3">
                    <label for="venta-hasta" class="form-label small text-muted fw-semibold">Fecha Hasta:</label>
                    <input type="date" id="venta-hasta" class="form-control">
                </div>

                <div class="col-12 col-sm-6 col-md-2">
                    <label for="filtro-producto" class="form-label small text-muted fw-semibold">Producto (Inmueble):</label>
                    <select id="filtro-producto" class="form-select">
                        <option value="">Todos</option>
                        <option value="apartamento">Apartamento</option>
                        <option value="casa">Casa</option>
                        <option value="lote">Lote / Terreno</option>
                        <option value="local">Local Comercial</option>
                    </select>
                </div>

                <div class="col-12 col-sm-6 col-md-2">
                    <label for="filtro-vendedor" class="form-label small text-muted fw-semibold">Vendedor:</label>
                    <select id="filtro-vendedor" class="form-select">
                        <option value="">Todos</option>
                        <option value="vendedor-1">Andres Guerra</option>
                        <option value="vendedor-2">Sergio Ochoa</option>
                    </select>
                </div>

                <div class="col-12 col-sm-6 col-md-2">
                    <label for="filtro-cliente" class="form-label small text-muted fw-semibold">Cliente:</label>
                    <select id="filtro-cliente" class="form-select">
                        <option value="">Todos</option>
                        <option value="cliente-1">Samuel Jaramillo</option>
                    </select>
                </div>
                
                <div class="col-12 d-flex gap-2 justify-content-end mt-4">
                    <button type="button" id="btn-limpiar-ventas" class="btn btn-outline-secondary px-4 fw-semibold">
                        Limpiar Filtros
                    </button>
                    <button type="button" id="btn-filtrar-ventas" class="btn btn-success px-5 fw-bold">
                        <i class="fas fa-search me-2"></i> Generar Reporte
                    </button>
                </div>

            </form>
        </div>

        <div class="card border-0 shadow-sm p-4">
            <h5 class="fw-bold mb-3 text-secondary"><i class="fas fa-file-invoice-dollar me-2"></i> Historial de Transacciones</h5>
            <div class="table-responsive" style="overflow-x: auto;">
                <table class="table align-middle">
                    <thead>
                        <tr>
                            <th>ID Código</th>
                            <th>Fecha</th>
                            <th>Inmueble (Producto)</th>
                            <th>Vendedor</th>
                            <th>Cliente</th>
                            <th>Valor de Cierre</th>
                            <th style="text-align: center;">Estado</th>
                        </tr>
                    </thead>
                    <tbody id="ventas-table-body">
                        <tr>
                            <td colspan="7" class="text-center text-muted py-4">
                                <i class="fas fa-info-circle me-2"></i> No se encontraron ventas en el periodo seleccionado o con los filtros aplicados.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/reporteVentas.js"></script> 
</body>
</html>
