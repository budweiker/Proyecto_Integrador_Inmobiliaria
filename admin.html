<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard - Inmobiliaria</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="css/admin.css">
    <style>
        /* ===== SEARCH BAR ===== */
        .search-wrapper {
            position: relative;
            max-width: 420px;
        }
        .search-wrapper .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 0.85rem;
            pointer-events: none;
        }
        #search-input {
            width: 100%;
            padding: 10px 38px 10px 38px;
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.88rem;
            color: #1e293b;
            background: #f8fafc;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
            outline: none;
        }
        #search-input:focus {
            border-color: #2563eb;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
        }
        #search-input::placeholder { color: #b0bec5; }
        #btn-clear-search {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            padding: 4px;
            font-size: 0.78rem;
            border-radius: 50%;
            transition: color 0.15s, background 0.15s;
            line-height: 1;
        }
        #btn-clear-search:hover { color: #475569; background: #f1f5f9; }

        /* ===== BADGE ESTADO ===== */
        .badge-estado {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 0.76rem;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 20px;
            letter-spacing: 0.01em;
        }
        .badge-estado.activo {
            background: #dcfce7;
            color: #16a34a;
        }
        .badge-estado.inactivo {
            background: #fee2e2;
            color: #dc2626;
        }

        /* ===== BOTÓN TOGGLE ===== */
        .btn-toggle {
            border: none;
            padding: 6px 9px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 0.82rem;
            margin-right: 5px;
            transition: background 0.15s, transform 0.1s;
        }
        .btn-toggle:active { transform: scale(0.93); }
        .btn-desactivar {
            background: #fef9c3;
            color: #b45309;
        }
        .btn-desactivar:hover { background: #fde68a; }
        .btn-activar {
            background: #dcfce7;
            color: #16a34a;
        }
        .btn-activar:hover { background: #bbf7d0; }
        .btn-toggle:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Tabla col extra */
        table thead th:nth-child(6) { min-width: 100px; }
        table thead th:nth-child(7) { min-width: 120px; }

        /* Contador en tarjeta usuarios */
        #total-usuarios { transition: all 0.3s; }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <div class="header">
            <h2><i class="fas fa-users-cog" style="color: #64b5f6; margin-right: 12px;"></i> Panel de Usuarios</h2>
            <a href="home.html" class="btn-home"><i class="fas fa-arrow-left"></i> Volver</a>
        </div>
        
        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>Cédula</th>
                        <th>Nombre</th>
                        <th>Correo</th>
                        <th>Fecha de Nac.</th>
                        <th>Rol</th>
                        <th style="text-align: center;">Acciones</th>
                    </tr>
                </thead>
                <tbody id="users-table-body">
                    <tr><td colspan="5" class="loading"><i class="fas fa-spinner fa-spin"></i> Cargando usuarios...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/admin.js"></script>
</body>
</html>
