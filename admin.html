<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard - Inmobiliaria</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <div class="dashboard-container container-fluid p-4">
        
        <!-- Header -->
        <div class="header">
            <h2>
                <i class="fas fa-users-cog"></i> 
                Panel de Administración 
                <span class="badge-admin-title ml-2">Admin</span>
            </h2>
            <a href="home.html" class="btn-home"><i class="fas fa-arrow-left"></i> Volver</a>
        </div>
        
        <!-- Statistics Cards Grid (4 Columns) -->
        <div class="row g-4 mb-4">
            <!-- Card 1: Inmuebles Activos -->
            <div class="col-12 col-sm-6 col-lg-3">
                <div class="card h-100 border-0 shadow-sm p-3 stat-card" style="border-left: 5px solid #2563eb !important;">
                    <div class="card-body d-flex align-items-center justify-content-between">
                        <div>
                            <h6 class="text-muted text-uppercase small fw-bold">Inmuebles Activos</h6>
                            <h3 class="fw-bold text-dark m-0">24</h3>
                        </div>
                        <div class="bg-primary bg-opacity-10 p-3 rounded-circle">
                            <i class="fas fa-home fa-2x text-primary"></i>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Card 2: Interesados (WhatsApp) -->
            <div class="col-12 col-sm-6 col-lg-3">
                <div class="card h-100 border-0 shadow-sm p-3 stat-card" style="border-left: 5px solid #22c55e !important;">
                    <div class="card-body d-flex align-items-center justify-content-between">
                        <div>
                            <h6 class="text-muted text-uppercase small fw-bold">Interesados (WhatsApp)</h6>
                            <h3 class="fw-bold text-dark m-0">142</h3>
                        </div>
                        <div class="bg-success bg-opacity-10 p-3 rounded-circle">
                            <i class="fab fa-whatsapp fa-2x text-success"></i>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Card 3: Visitas del Mes -->
            <div class="col-12 col-sm-6 col-lg-3">
                <div class="card h-100 border-0 shadow-sm p-3 stat-card" style="border-left: 5px solid #eab308 !important;">
                    <div class="card-body d-flex align-items-center justify-content-between">
                        <div>
                            <h6 class="text-muted text-uppercase small fw-bold">Visitas del Mes</h6>
                            <h3 class="fw-bold text-dark m-0">3,840</h3>
                        </div>
                        <div class="bg-warning bg-opacity-10 p-3 rounded-circle">
                            <i class="fas fa-eye fa-2x text-warning"></i>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Card 4: Total Usuarios -->
            <div class="col-12 col-sm-6 col-lg-3">
                <div class="card h-100 border-0 shadow-sm p-3 stat-card" style="border-left: 5px solid #8b5cf6 !important;">
                    <div class="card-body d-flex align-items-center justify-content-between">
                        <div>
                            <h6 class="text-muted text-uppercase small fw-bold">Total Usuarios</h6>
                            <h3 class="fw-bold text-dark m-0" id="total-usuarios">0</h3>
                        </div>
                        <div class="bg-purple bg-opacity-10 p-3 rounded-circle" style="background-color: rgba(139, 92, 246, 0.1);">
                            <i class="fas fa-users fa-2x" style="color: #8b5cf6;"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Date Filters Form -->
        <div class="filter-section mb-4">
            <h5 class="fw-bold mb-3 text-secondary"><i class="fas fa-filter me-2"></i> Filtrar Reportes por Fecha</h5>
            <form id="filter-form" class="row g-3 align-items-end">
                <div class="col-12 col-md-4">
                    <label for="fecha-desde" class="form-label small text-muted fw-semibold">Fecha Desde:</label>
                    <input type="date" id="fecha-desde" class="form-control date-input">
                </div>
                
                <div class="col-12 col-md-4">
                    <label for="fecha-hasta" class="form-label small text-muted fw-semibold">Fecha Hasta:</label>
                    <input type="date" id="fecha-hasta" class="form-control date-input">
                </div>
                
                <div class="col-12 col-md-4 d-flex gap-2">
                    <button type="button" id="btn-filtrar" class="btn btn-filtrar w-100 fw-bold">
                        <i class="fas fa-search me-2"></i> Filtrar
                    </button>
                    <button type="button" id="btn-limpiar" class="btn btn-limpiar w-100 fw-semibold">
                        Limpiar
                    </button>
                </div>
            </form>
        </div>

        <!-- Users Table -->
        <div class="card border-0 shadow-sm p-4">
            <h5 class="fw-bold mb-3 text-secondary"><i class="fas fa-list me-2"></i> Lista de Usuarios Registrados</h5>
            <div class="table-wrapper table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Cédula</th>
                            <th>Nombre</th>
                            <th>Correo</th>
                            <th>Fecha de Nac.</th>
                            <th>Fecha Registro</th> 
                            <th>Rol</th>
                            <th style="text-align: center;">Estado</th>
                            <th style="text-align: center; width: 100px;">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="users-table-body">
                        <tr><td colspan="8" class="loading"><i class="fas fa-spinner fa-spin"></i> Cargando usuarios...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/admin.js"></script>
    
    <!-- 
      SETUP INICIAL: Para crear el usuario admin por primera vez:
      1. Agrega temporalmente: <script type="module" src="js/createAdmin.js"></script>
      2. Abre admin.html en el browser (debes estar deslogueado)
      3. Espera el alert de confirmación
      4. ELIMINA la línea del script — no debe quedar en producción
    -->
</body>
</html>
