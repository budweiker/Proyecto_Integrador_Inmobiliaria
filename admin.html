<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard - Inmobiliaria</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="css/admin.css">
    <style>
        /* ===== SEARCH BAR ===== */
        .search-wrapper {
            position: relative;
            max-width: 420px;
        }
        .search-wrapper .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 0.85rem;
            pointer-events: none;
        }
        #search-input {
            width: 100%;
            padding: 10px 38px 10px 38px;
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.88rem;
            color: #1e293b;
            background: #f8fafc;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
            outline: none;
        }
        #search-input:focus {
            border-color: #2563eb;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
        }
        #search-input::placeholder { color: #b0bec5; }
        #btn-clear-search {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            padding: 4px;
            font-size: 0.78rem;
            border-radius: 50%;
            transition: color 0.15s, background 0.15s;
            line-height: 1;
        }
        #btn-clear-search:hover { color: #475569; background: #f1f5f9; }

        /* ===== BADGE ESTADO ===== */
        .badge-estado {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 0.76rem;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 20px;
            letter-spacing: 0.01em;
        }
        .badge-estado.activo {
            background: #dcfce7;
            color: #16a34a;
        }
        .badge-estado.inactivo {
            background: #fee2e2;
            color: #dc2626;
        }

        /* ===== BOTÓN TOGGLE ===== */
        .btn-toggle {
            border: none;
            padding: 6px 9px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 0.82rem;
            margin-right: 5px;
            transition: background 0.15s, transform 0.1s;
        }
        .btn-toggle:active { transform: scale(0.93); }
        .btn-desactivar {
            background: #fef9c3;
            color: #b45309;
        }
        .btn-desactivar:hover { background: #fde68a; }
        .btn-activar {
            background: #dcfce7;
            color: #16a34a;
        }
        .btn-activar:hover { background: #bbf7d0; }
        .btn-toggle:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Tabla col extra */
        table thead th:nth-child(6) { min-width: 100px; }
        table thead th:nth-child(7) { min-width: 120px; }

        /* Contador en tarjeta usuarios */
        #total-usuarios { transition: all 0.3s; }
    </style>
</head>
<body>
    <div class="dashboard-container container-fluid p-4">
        
        <div class="header d-flex justify-content-between align-items-center mb-4">
            <h2><i class="fas fa-users-cog" style="color: #64b5f6; margin-right: 12px;"></i> Panel de Administración</h2>
            <a href="home.html" class="btn-home text-decoration-none"><i class="fas fa-arrow-left"></i> Volver</a>
        </div>
        
        <!-- TARJETAS DE STATS -->
        <div class="row g-4 mb-5">
            <div class="col-12 col-md-3">
                <div class="card h-100 border-0 shadow-sm p-3" style="border-left: 5px solid #2563eb !important;">
                    <div class="card-body d-flex align-items-center justify-content-between">
                        <div>
                            <h6 class="text-muted text-uppercase small fw-bold">Inmuebles Activos</h6>
                            <h3 class="fw-bold text-dark m-0">24</h3>
                        </div>
                        <div class="bg-primary bg-opacity-10 p-3 rounded-circle">
                            <i class="fas fa-home fa-2x text-primary"></i>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-12 col-md-3">
                <div class="card h-100 border-0 shadow-sm p-3" style="border-left: 5px solid #22c55e !important;">
                    <div class="card-body d-flex align-items-center justify-content-between">
                        <div>
                            <h6 class="text-muted text-uppercase small fw-bold">Interesados (WhatsApp)</h6>
                            <h3 class="fw-bold text-dark m-0">142</h3>
                        </div>
                        <div class="bg-success bg-opacity-10 p-3 rounded-circle">
                            <i class="fab fa-whatsapp fa-2x text-success"></i>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-12 col-md-3">
                <div class="card h-100 border-0 shadow-sm p-3" style="border-left: 5px solid #eab308 !important;">
                    <div class="card-body d-flex align-items-center justify-content-between">
                        <div>
                            <h6 class="text-muted text-uppercase small fw-bold">Visitas del Mes</h6>
                            <h3 class="fw-bold text-dark m-0">3,840</h3>
                        </div>
                        <div class="bg-warning bg-opacity-10 p-3 rounded-circle">
                            <i class="fas fa-eye fa-2x text-warning"></i>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-12 col-md-3">
                <div class="card h-100 border-0 shadow-sm p-3" style="border-left: 5px solid #8b5cf6 !important;">
                    <div class="card-body d-flex align-items-center justify-content-between">
                        <div>
                            <h6 class="text-muted text-uppercase small fw-bold">Total Usuarios</h6>
                            <h3 class="fw-bold text-dark m-0" id="total-usuarios">—</h3>
                        </div>
                        <div class="p-3 rounded-circle" style="background: rgba(139,92,246,0.1);">
                            <i class="fas fa-users fa-2x" style="color:#8b5cf6;"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- TABLA DE USUARIOS -->
        <div class="card border-0 shadow-sm p-4">

            <!-- Header de la tabla con buscador -->
            <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-3">
                <h5 class="fw-bold text-secondary m-0">
                    <i class="fas fa-list me-2"></i> Lista de Usuarios Registrados
                </h5>
                <div class="search-wrapper">
                    <i class="fas fa-search search-icon"></i>
                    <input 
                        type="text" 
                        id="search-input" 
                        placeholder="Buscar por correo"
                        autocomplete="off"
                    />
                    <button id="btn-clear-search" title="Limpiar búsqueda">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            </div>

            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Cédula</th>
                            <th>Nombre</th>
                            <th>Correo</th>
                            <th>Fecha de Nac.</th>
                            <th>Rol</th>
                            <th style="text-align:center;">Estado</th>
                            <th style="text-align: center;">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="users-table-body">
                        <tr><td colspan="7" class="loading"><i class="fas fa-spinner fa-spin"></i> Cargando usuarios...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/admin.js"></script>
</body>
</html>
